
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frog Pond Adventure</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    color: #174b3a;
    background: linear-gradient(#dff8e8, #9bd8b5);
}
.screen {
    min-height: 100vh;
    padding: 20px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
.hidden { display: none !important; }
h1 { font-size: clamp(30px, 6vw, 48px); }
button {
    padding: 14px 28px;
    margin: 8px;
    border: 0;
    border-radius: 12px;
    background: #218c54;
    color: white;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
}
button:hover { background: #126b3b; }
#game {
    display: block;
    width: min(900px, 96vw);
    height: auto;
    border: 4px solid #27785c;
    border-radius: 12px;
    touch-action: manipulation;
}
.header {
    width: min(900px, 96vw);
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 8px;
}
.hint { font-size: 14px; }
</style>
</head>
<body>

<section id="home" class="screen">
    <div style="font-size:70px">🐸</div>
    <h1>Frog Pond Adventure</h1>
    <p>Jump over the lotus flowers. Don't let the snake catch you!</p>
    <button id="play">▶ Play Game</button>
    <p class="hint">SPACE / ↑ / W / Tap to jump</p>
</section>

<section id="gameScreen" class="screen hidden">
    <div class="header">
        <span>🐸 Pond Adventure</span>
        <span id="score">Score: 0</span>
    </div>
    <canvas id="game" width="900" height="500"></canvas>
    <p class="hint">Press SPACE, ↑ or W, or tap the pond to jump!</p>
</section>

<section id="over" class="screen hidden">
    <div style="font-size:70px">🐸</div>
    <h1>Game Over!</h1>
    <p id="finalScore">Your score: 0</p>
    <p id="message"></p>
    <button id="restart">🔄 Play Again</button>
    <button id="homeBtn">⌂ Home</button>
</section>

<script>
(() => {
    const $ = id => document.getElementById(id);
    const canvas = $("game");
    const ctx = canvas.getContext("2d");

    const W = canvas.width;
    const H = canvas.height;
    const GROUND = 370;

    let running = false;
    let frameId = 0;
    let frame = 0;
    let score = 0;
    let frog, snake, lotuses, spawnTimer;

    function showScreen(name) {
        $("home").classList.toggle("hidden", name !== "home");
        $("gameScreen").classList.toggle("hidden", name !== "game");
        $("over").classList.toggle("hidden", name !== "over");
    }

    function startGame() {
        cancelAnimationFrame(frameId);

        frame = 0;
        score = 0;
        spawnTimer = 80;
        lotuses = [];

        frog = {
            x: 220,
            y: GROUND - 38,
            w: 42,
            h: 38,
            vy: 0,
            jumping: false
        };

        // Snake starts well behind the frog.
        snake = { x: 30, w: 42 };

        running = true;
        $("score").textContent = "Score: 0";
        showScreen("game");

        draw();
        frameId = requestAnimationFrame(loop);
    }

    function jump() {
        if (!running || frog.jumping) return;
        frog.vy = -14;
        frog.jumping = true;
    }

    function endGame(reason) {
        if (!running) return;

        running = false;
        cancelAnimationFrame(frameId);

        $("finalScore").textContent = "Your score: " + score;
        $("message").textContent = reason;
        showScreen("over");
    }

    // Lotus is drawn with canvas shapes, not an emoji.
    function drawLotus(f) {
        const x = f.x + f.w / 2;
        const y = GROUND - 22;

        // Green lily pad
        ctx.fillStyle = "#218b57";
        ctx.beginPath();
        ctx.ellipse(x, GROUND - 3, 24, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        // Outer petals
        for (let i = 0; i < 8; i++) {
            const a = i * Math.PI / 4;
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(a);
            ctx.fillStyle = i % 2 ? "#e94c94" : "#ff91c4";
            ctx.beginPath();
            ctx.ellipse(0, -9, 6, 13, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // Inner petals
        for (let i = 0; i < 5; i++) {
            const a = i * Math.PI * 2 / 5;
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(a);
            ctx.fillStyle = "#ffd1e5";
            ctx.beginPath();
            ctx.ellipse(0, -4, 4, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        ctx.fillStyle = "#ffdf55";
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();
    }

    function update() {
        frame++;

        // Frog physics
        frog.y += frog.vy;
        frog.vy += 0.65;

        const floor = GROUND - frog.h;
        if (frog.y >= floor) {
            frog.y = floor;
            frog.vy = 0;
            frog.jumping = false;
        }

        // Spawn lotus flowers
        spawnTimer--;
        if (spawnTimer <= 0) {
            lotuses.push({
                x: W + 20,
                w: 42,
                passed: false
            });
            spawnTimer = 100;
        }

        const speed = 4;

        for (const f of lotuses) {
            f.x -= speed;

            // Collision: frog must jump high enough to clear the flower.
            const frogBottom = frog.y + frog.h;
            const frogRight = frog.x + frog.w - 6;
            const frogLeft = frog.x + 6;
            const flowerLeft = f.x + 7;
            const flowerRight = f.x + f.w - 7;

            const horizontalHit =
                frogRight > flowerLeft && frogLeft < flowerRight;

            const standingOnGround = frogBottom >= GROUND - 42;

            if (horizontalHit && standingOnGround) {
                endGame("You hit a lotus! Try jumping a little earlier.");
                return;
            }

            // Award points and push the snake BACK once per flower.
            if (!f.passed && f.x + f.w < frog.x) {
                f.passed = true;
                score += 10;

                // Move the snake backward by 150 pixels.
                snake.x = Math.max(0, snake.x - 150);

                // Tiny visual reward flash.
                $("score").textContent = "Score: " + score + " 🌸";
            }
        }

        lotuses = lotuses.filter(f => f.x + f.w > -20);

        // Slow chase, so each successful dodge creates real distance.
        snake.x += 0.35;

        // The snake cannot catch the frog immediately after a setback.
        if (snake.x + snake.w >= frog.x) {
            endGame("The snake caught you! Dodge the flowers to push it back.");
            return;
        }

        if (frame % 6 === 0) score++;
        $("score").textContent = "Score: " + score;
    }

    function drawFrog() {
        const x = frog.x;
        const y = frog.y;

        // Body
        ctx.fillStyle = "#48b84d";
        ctx.beginPath();
        ctx.ellipse(x + 21, y + 23, 20, 15, 0, 0, Math.PI * 2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = "#48b84d";
        ctx.beginPath();
        ctx.arc(x + 10, y + 9, 8, 0, Math.PI * 2);
        ctx.arc(x + 31, y + 9, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(x + 10, y + 9, 5, 0, Math.PI * 2);
        ctx.arc(x + 31, y + 9, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#183d28";
        ctx.beginPath();
        ctx.arc(x + 11, y + 9, 2.5, 0, Math.PI * 2);
        ctx.arc(x + 32, y + 9, 2.5, 0, Math.PI * 2);
        ctx.fill();

        // Smile
        ctx.strokeStyle = "#174b3a";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x + 21, y + 22, 8, 0.15, Math.PI - 0.15);
        ctx.stroke();
    }

    function drawSnake() {
        const x = snake.x;
        const y = GROUND - 20;

        // Body
        ctx.fillStyle = "#398d42";
        ctx.beginPath();
        ctx.ellipse(x + 20, y, 24, 13, 0, 0, Math.PI * 2);
        ctx.fill();

        // Head
        ctx.beginPath();
        ctx.arc(x + 35, y - 5, 12, 0, Math.PI * 2);
        ctx.fill();

        // Eye
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(x + 39, y - 9, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#172d19";
        ctx.beginPath();
        ctx.arc(x + 40, y - 9, 2, 0, Math.PI * 2);
        ctx.fill();

        // Tongue
        ctx.strokeStyle = "#ed4265";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x + 45, y);
        ctx.lineTo(x + 53, y + 2);
        ctx.lineTo(x + 57, y - 2);
        ctx.moveTo(x + 53, y + 2);
        ctx.lineTo(x + 56, y + 6);
        ctx.stroke();
    }

    function draw() {
        // Sky
        const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
        sky.addColorStop(0, "#c6f4d9");
        sky.addColorStop(1, "#70cbb0");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H);

        // Bushes
        ctx.fillStyle = "#80c99a";
        for (let i = 0; i < 8; i++) {
            ctx.beginPath();
            ctx.arc(i * 135, 195, 65, Math.PI, 0);
            ctx.fill();
        }

        // Pond and bank
        ctx.fillStyle = "#299eaf";
        ctx.fillRect(0, GROUND, W, H - GROUND);

        ctx.fillStyle = "#398e5c";
        ctx.fillRect(0, GROUND - 8, W, 12);

        ctx.fillStyle = "#a4df7b";
        ctx.fillRect(0, GROUND - 8, W, 5);

        // Water ripples
        ctx.strokeStyle = "#a8f4ed";
        ctx.lineWidth = 2;
        for (let i = 0; i < 9; i++) {
            const x = (i * 117 + frame * 0.6) % W;
            const y = GROUND + 35 + (i % 3) * 32;
            ctx.beginPath();
            ctx.ellipse(x, y, 22, 5, 0, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Sun
        ctx.fillStyle = "#fff0a0";
        ctx.beginPath();
        ctx.arc(815, 65, 32, 0, Math.PI * 2);
        ctx.fill();

        // Lotus obstacles
        for (const f of lotuses) drawLotus(f);

        // Snake and frog
        drawSnake();
        drawFrog();

        // Score
        ctx.fillStyle = "#124d3b";
        ctx.font = "bold 23px Arial";
        ctx.fillText("Score: " + score, 22, 30);
    }

    function loop() {
        if (!running) return;

        update();
        if (!running) return;

        draw();
        frameId = requestAnimationFrame(loop);
    }

    $("play").addEventListener("click", startGame);
    $("restart").addEventListener("click", startGame);

    $("homeBtn").addEventListener("click", () => {
        running = false;
        cancelAnimationFrame(frameId);
        showScreen("home");
    });

    document.addEventListener("keydown", event => {
        if (["Space", "ArrowUp", "KeyW"].includes(event.code) && running) {
            event.preventDefault();
            jump();
        }
    });

    canvas.addEventListener("pointerdown", event => {
        if (!running) return;
        event.preventDefault();
        jump();
    });

    showScreen("home");
})();
</script>
</body>
</html>
