
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frog Pond Adventure</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main id="homeScreen" class="screen">
        <div class="title-icon">🐸</div>
        <h1>Frog Pond Adventure</h1>
        <p>Jump over the lotuses. Don't let the snake catch you!</p>
        <button id="playBtn">▶ Play Game</button>
        <p class="instructions">SPACE / ↑ / W / Tap to jump</p>
    </main>

    <main id="gameScreen" class="screen hidden">
        <div class="game-header">
            <span>🐸 Pond Adventure</span>
            <span id="score">Score: 0</span>
        </div>

        <canvas id="game" width="900" height="500"></canvas>

        <p class="instructions">
            Press SPACE or tap the pond to jump!
        </p>
    </main>

    <main id="gameOverScreen" class="screen hidden">
        <div class="title-icon">🐸</div>
        <h1>Game Over!</h1>
        <p id="finalScore">Your score: 0</p>
        <p id="gameMessage">The pond adventure is over!</p>
        <button id="restartBtn">🔄 Play Again</button>
        <button id="homeBtn" class="secondary">⌂ Home</button>
    </main>

    <script src="src/main.js"></script>
</body>
</html>
