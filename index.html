<!DOCTYPE html>
<html>
<head>
    <title>Frog Music Game</title>
    <style>
        body {
            margin: 0;
            text-align: center;
            font-family: Arial;
            background: #dff6ff;
        }

        canvas {
            display: none; /* hidden until game starts */
            background: white;
        }

        #homeScreen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #playBtn {
            font-size: 30px;
            padding: 15px 30px;
            cursor: pointer;
            border-radius: 10px;
            border: none;
            background: green;
            color: white;
        }
    </style>
</head>

<body>

<div id="homeScreen">
    <h1>🐸 Frog Music Game</h1>
    <button id="playBtn">▶️ Play</button>
</div>

<canvas id="game"></canvas>

<script src="main.js"></script>

</body>
</html>
